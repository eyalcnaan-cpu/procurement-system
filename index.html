<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procurement Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f4f0;color:#1a1a1a;direction:ltr;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;background:#fff;border-bottom:1px solid #e8e6e0;position:sticky;top:0;z-index:50}
.topbar-brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600}
.topbar-brand svg{width:24px;height:24px}
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px;color:#666}
.avatar{width:36px;height:36px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#1d4ed8}
.tabs{display:flex;gap:2px;padding:0 40px;background:#fff;border-bottom:1px solid #e8e6e0}
.tab{padding:14px 22px;font-size:15px;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'Inter',sans-serif;font-weight:500;transition:color .15s}
.tab:hover{color:#1a1a1a}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.content{padding:28px 40px;max-width:1600px;margin:0 auto}
.page{display:none}.page.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px}
.stat-card{background:#fff;border-radius:14px;padding:24px;border:1px solid #e8e6e0}
.stat-num{font-size:34px;font-weight:600;margin-bottom:6px}
.stat-label{font-size:13px;color:#888}
.stat-pending .stat-num{color:#92400e}
.stat-inorder .stat-num{color:#166534}
.stat-extra .stat-num{color:#6b21a8}
.card{background:#fff;border-radius:14px;border:1px solid #e8e6e0;padding:28px;margin-bottom:24px}
.card-title{font-size:16px;font-weight:600;margin-bottom:18px;color:#1a1a1a}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.form-group{display:flex;flex-direction:column;gap:7px}
.form-group label{font-size:14px;color:#555;font-weight:500}
.form-group input,.form-group select,.form-group textarea{font-size:15px;border-radius:9px;border:1px solid #d4d0c8;padding:11px 14px;background:#fff;color:#1a1a1a;width:100%;font-family:'Inter',sans-serif;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#1a1a1a}
.form-group textarea{resize:vertical;min-height:90px}
.form-full{grid-column:1/-1}
.items-table{width:100%;border-collapse:collapse;font-size:14px}
.items-table th{text-align:left;padding:11px 14px;background:#f9f8f5;color:#666;font-weight:600;border-bottom:1px solid #e8e6e0;font-size:13px}
.items-table td{padding:10px 14px;border-bottom:1px solid #f0ede8;color:#1a1a1a}
.items-table tr:last-child td{border-bottom:none}
.items-table input{border:1px solid #e0ddd6;border-radius:7px;padding:7px 10px;font-size:14px;background:#fff;color:#1a1a1a;width:100%;font-family:'Inter',sans-serif}
.items-table input:focus{outline:none;border-color:#1a1a1a}
.btn{padding:10px 22px;border-radius:9px;border:1px solid #d4d0c8;background:#fff;color:#1a1a1a;font-size:15px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;transition:all .15s}
.btn:hover{background:#f5f4f0;border-color:#aaa}
.btn:active{transform:scale(0.98)}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-primary:hover{background:#333;border-color:#333}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-danger{border-color:#fca5a5;color:#991b1b}
.btn-danger:hover{background:#fef2f2}
.btn-success{border-color:#86efac;color:#166534}
.btn-success:hover{background:#f0fdf4}
.form-actions{display:flex;gap:12px;justify-content:flex-end;padding-top:16px;border-top:1px solid #f0ede8;margin-top:8px}
.requests-list{display:flex;flex-direction:column;gap:12px}
.req-item{background:#fff;border:1px solid #e8e6e0;border-radius:14px;padding:20px 24px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.req-item:hover{border-color:#aaa;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.req-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.req-title{font-size:15px;font-weight:600;color:#1a1a1a}
.req-meta{font-size:13px;color:#888;display:flex;gap:16px;flex-wrap:wrap}
.req-meta span{display:flex;align-items:center;gap:4px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-inorder{background:#dcfce7;color:#166534}
.badge-ordered{background:#dbeafe;color:#1e40af}
.badge-received{background:#f3e8ff;color:#6b21a8}
.filter-bar{display:flex;gap:12px;margin-bottom:20px;align-items:center}
.filter-bar select,.filter-bar input{font-size:14px;padding:10px 14px;border:1px solid #d4d0c8;border-radius:9px;background:#fff;color:#1a1a1a;font-family:'Inter',sans-serif}
.filter-bar input{flex:1}
.filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:#1a1a1a}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;padding:24px}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:18px;border:1px solid #e8e6e0;padding:32px;width:100%;max-width:860px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.modal-header h3{font-size:19px;font-weight:600}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.info-item{background:#f9f8f5;border-radius:10px;padding:16px}
.info-item .lbl{font-size:12px;color:#888;margin-bottom:4px;font-weight:500}
.info-item .val{font-size:15px;font-weight:500;color:#1a1a1a}
.action-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;border-top:1px solid #f0ede8;padding-top:16px}
.chart-bars{display:flex;gap:12px;align-items:flex-end;height:150px;padding:8px 0 0}
.bar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .4s ease}
.bar-label{font-size:12px;color:#888;text-align:center}
.bar-val{font-size:13px;font-weight:600;color:#1a1a1a}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:14px 28px;border-radius:10px;font-size:15px;font-family:'Inter',sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.toast.show{opacity:1}
.loading{display:flex;align-items:center;justify-content:center;padding:56px;color:#888;font-size:15px;gap:10px}
.spinner{width:20px;height:20px;border:2px solid #e8e6e0;border-top-color:#1a1a1a;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:56px;color:#888;font-size:15px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.upload-zone{border:2px dashed #d4d0c8;border-radius:12px;padding:28px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .2s,background .2s;background:#fafaf8}
.upload-zone:hover{border-color:#aaa;background:#f5f4f0}
.upload-zone.dragover{border-color:#1a1a1a;background:#f0ede8}
.upload-zone.has-file{border-color:#86efac;background:#f0fdf4}
@media(max-width:700px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .info-grid{grid-template-columns:1fr}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .tabs{padding:0 16px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
    Procurement System
  </div>
  <div class="user-chip">
    <span>Hello, User</span>
    <div class="avatar">U</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('dashboard',this)">Dashboard</button>
  <button class="tab" onclick="switchTab('new',this)">New Request</button>
  <button class="tab" onclick="switchTab('requests',this)">All Requests</button>
</div>

<div class="content">

  <!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="s-total">—</div>
        <div class="stat-label">Total Requests</div>
      </div>
      <div class="stat-card stat-pending">
        <div class="stat-num" id="s-pending">—</div>
        <div class="stat-label">Pending Approval</div>
      </div>
      <div class="stat-card stat-inorder">
        <div class="stat-num" id="s-inorder">—</div>
        <div class="stat-label">In Order</div>
      </div>
      <div class="stat-card stat-extra">
        <div class="stat-num" id="s-received">—</div>
        <div class="stat-label">Received</div>
      </div>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="card-title">Requests by Status</div>
        <div class="chart-bars" id="status-chart"><div class="loading"><div class="spinner"></div> Loading...</div></div>
      </div>
      <div class="card">
        <div class="card-title">Recent Requests</div>
        <div id="recent-list"><div class="loading"><div class="spinner"></div> Loading...</div></div>
      </div>
    </div>
  </div>

  <!-- NEW REQUEST -->
  <div class="page" id="page-new">
    <div class="card">
      <div class="card-title">Submit a New Purchase Request</div>

      <div style="display:grid;grid-template-columns:320px 1fr;gap:28px;align-items:start">

        <!-- LEFT: Requester + Details + PDF -->
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="form-group">
            <label>Requester Name</label>
            <input type="text" id="f-requester" placeholder="Full name">
          </div>
          <div class="form-group">
            <label>Request Details</label>
            <textarea id="f-justification" placeholder="Describe the request..." style="min-height:140px"></textarea>
          </div>
          <div class="form-group">
            <label>Price Quote (PDF — optional)</label>
            <div class="upload-zone" id="upload-zone" onclick="document.getElementById('f-pdf').click()" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
              <div id="upload-label" style="display:flex;flex-direction:column;align-items:center;gap:6px">
                <span style="font-size:22px">📄</span>
                <span>Drag a PDF here or <u>click to browse</u></span>
                <span style="font-size:12px;color:#aaa">PDF only, up to 10MB</span>
              </div>
              <div id="upload-chosen" style="display:none;font-size:13px;font-weight:500;color:#166534"></div>
            </div>
            <input type="file" id="f-pdf" accept="application/pdf" style="display:none" onchange="handleFileSelect(this)">
          </div>
        </div>

        <!-- RIGHT: Items -->
        <div>
          <div class="card-title" style="margin-bottom:14px">Items</div>
          <div id="items-body">
            <div class="item-row" style="background:#f9f8f5;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #e8e6e0">
              <div style="display:grid;grid-template-columns:2fr 1fr 1fr 80px;gap:12px;margin-bottom:12px">
                <div class="form-group">
                  <label style="font-size:12px">Item Name</label>
                  <input type="text" placeholder="Item name" class="item-name">
                </div>
                <div class="form-group">
                  <label style="font-size:12px">PN</label>
                  <input type="text" placeholder="Optional" class="item-pn">
                </div>
                <div class="form-group">
                  <label style="font-size:12px">Manufacturer PN</label>
                  <input type="text" placeholder="Mfr PN" class="item-mfr-pn">
                </div>
                <div class="form-group">
                  <label style="font-size:12px">Qty</label>
                  <input type="number" min="1" value="1" class="item-qty">
                </div>
              </div>
              <div style="display:grid;grid-template-columns:120px 100px 1fr 1fr 1fr 36px;gap:12px;align-items:end">
                <div class="form-group">
                  <label style="font-size:12px">Price</label>
                  <input type="number" min="0" step="0.01" placeholder="0.00" class="item-price">
                </div>
                <div class="form-group">
                  <label style="font-size:12px">Currency</label>
                  <select class="item-currency" style="border:1px solid #d4d0c8;border-radius:9px;padding:11px 10px;font-size:15px;background:#fff;font-family:'Inter',sans-serif;width:100%">
                    <option>$</option><option>€</option><option>£</option><option>₪</option><option>¥</option>
                  </select>
                </div>
                <div class="form-group">
                  <label style="font-size:12px">Info</label>
                  <input type="text" placeholder="Info..." class="item-tech">
                </div>
                <div class="form-group">
                  <label style="font-size:12px">Link</label>
                  <input type="text" placeholder="https://..." class="item-link">
                </div>
                <div class="form-group">
                  <label style="font-size:12px">Vendor</label>
                  <input type="text" placeholder="Optional" class="item-vendor">
                </div>
                <button class="btn btn-sm btn-danger" onclick="removeRow(this)" style="margin-bottom:2px">✕</button>
              </div>
            </div>
          </div>
          <div style="margin-top:4px">
            <button class="btn btn-sm" onclick="addRow()">+ Add Item</button>
          </div>
        </div>

      </div>

      <div class="form-actions" style="margin-top:24px">
        <button class="btn" onclick="clearForm()">Clear Form</button>
        <button class="btn btn-primary" id="submit-btn" onclick="submitRequest()">Submit Request →</button>
      </div>
    </div>
  </div>

  <!-- ALL REQUESTS -->
  <div class="page" id="page-requests">
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="Search by name, ID..." oninput="renderRequests()">
      <select id="filter-status" onchange="renderRequests()">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="In Order">In Order</option>
        <option value="Ordered">Ordered</option>
        <option value="Received">Received</option>
      </select>
      <button class="btn btn-sm" onclick="loadRequests()">↻ Refresh</button>
    </div>
    <div class="requests-list" id="requests-list">
      <div class="loading"><div class="spinner"></div> Loading requests...</div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="detail-modal" onclick="handleOverlayClick(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Request Details</h3>
      <button class="btn btn-sm" onclick="closeModal()">✕ Close</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://uatntzhfbmohdgjtjjqe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Z589swlj8XuEwBMvUvNkQQ_VJTaY_sA';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let allRequests = [];
let nextIdNum = 1;

async function loadRequests() {
  const { data, error } = await db.from('requests').select('*').order('created', { ascending: false });
  if (error) { showToast('Error loading data'); console.error(error); return; }
  allRequests = data || [];
  if (allRequests.length > 0) {
    const ids = allRequests.map(r => parseInt(r.id.replace('RQ-',''))).filter(n => !isNaN(n));
    nextIdNum = Math.max(...ids) + 1;
  }
  renderRequests();
  renderDashboard();
}

function statusClass(s) {
  return { 'Pending': 'pending', 'In Order': 'inorder', 'Ordered': 'ordered', 'Received': 'received' }[s] || 'pending';
}

function renderDashboard() {
  const pending  = allRequests.filter(r => r.status === 'Pending').length;
  const inorder  = allRequests.filter(r => r.status === 'In Order').length;
  const received = allRequests.filter(r => r.status === 'Received').length;
  document.getElementById('s-total').textContent    = allRequests.length;
  document.getElementById('s-pending').textContent  = pending;
  document.getElementById('s-inorder').textContent  = inorder;
  document.getElementById('s-received').textContent = received;

  const statuses = ['Pending', 'In Order', 'Ordered', 'Received'];
  const colors   = { 'Pending': '#fcd34d', 'In Order': '#86efac', 'Ordered': '#93c5fd', 'Received': '#d8b4fe' };
  const counts   = statuses.map(s => allRequests.filter(r => r.status === s).length);
  const max      = Math.max(...counts, 1);
  document.getElementById('status-chart').innerHTML = statuses.map((s, i) =>
    `<div class="bar-wrap"><div class="bar-val">${counts[i]}</div><div class="bar" style="height:${Math.round(counts[i]/max*100)}px;background:${colors[s]}"></div><div class="bar-label">${s}</div></div>`
  ).join('');

  const recent = document.getElementById('recent-list');
  if (!allRequests.length) { recent.innerHTML = '<div class="empty-state">No requests yet</div>'; return; }
  recent.innerHTML = allRequests.slice(0, 5).map(r => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0ede8;cursor:pointer" onclick="openModal('${r.id}')">
      <div>
        <div style="font-size:13px;font-weight:600">${r.id} — ${r.requester}</div>
        <div style="font-size:12px;color:#888;margin-top:2px">${r.created}</div>
      </div>
      <span class="badge badge-${statusClass(r.status)}">${r.status}</span>
    </div>`).join('');
}

function renderRequests() {
  const q  = (document.getElementById('search-input').value || '').toLowerCase();
  const st = document.getElementById('filter-status').value;
  let list = allRequests.filter(r => {
    if (q && !r.id.toLowerCase().includes(q) && !r.requester.toLowerCase().includes(q)) return false;
    if (st && r.status !== st) return false;
    return true;
  });
  const el = document.getElementById('requests-list');
  if (!list.length) { el.innerHTML = '<div class="empty-state">No requests found</div>'; return; }
  el.innerHTML = list.map(r => `
    <div class="req-item" onclick="openModal('${r.id}')">
      <div class="req-header">
        <span class="req-title">${r.id} — ${r.items && r.items.length > 0 ? (r.items.length > 1 ? r.items[0].name + ' +' + (r.items.length-1) + ' more' : r.items[0].name) : 'No items'}</span>
        <div style="display:flex;align-items:center;gap:8px">
          ${r.status === 'Ordered' && r.delivery_date ? `<span style="font-size:12px;color:#888">🚚 ${r.delivery_date}</span>` : ''}
          <span class="badge badge-${statusClass(r.status)}">${r.status}</span>
        </div>
      </div>
      <div class="req-meta">
        <span>👤 ${r.requester}</span>
        <span>📅 ${r.created}</span>
        <span>${r.items ? r.items.length + ' item(s)' : ''}</span>
      </div>
    </div>`).join('');
}

function openModal(id) {
  const r = allRequests.find(x => x.id === id);
  if (!r) return;
  document.getElementById('modal-title').textContent = r.id + ' — ' + r.requester;

  const actionMap = {
    'Pending': `<button class="btn btn-success" onclick="updateStatus('${id}','In Order')">✓ Approve & Place In Order</button>`,
    'In Order': `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;gap:4px">
          <label style="font-size:12px;color:#888;font-weight:500">Expected Delivery Date</label>
          <input type="date" id="delivery-date-input" value="${r.delivery_date || ''}" style="border:1px solid #d4d0c8;border-radius:8px;padding:7px 10px;font-size:13px;font-family:'Inter',sans-serif">
        </div>
        <button class="btn btn-success" style="margin-top:18px" onclick="updateStatusWithDelivery('${id}','Ordered')">📦 Mark as Ordered</button>
      </div>`,
    'Ordered': `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;gap:4px">
          <label style="font-size:12px;color:#888;font-weight:500">Expected Delivery Date</label>
          <input type="date" id="delivery-date-input" value="${r.delivery_date || ''}" style="border:1px solid #d4d0c8;border-radius:8px;padding:7px 10px;font-size:13px;font-family:'Inter',sans-serif">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:18px">
          <button class="btn btn-sm" onclick="saveDeliveryDate('${id}')">💾 Save Date</button>
          <button class="btn btn-success btn-sm" onclick="updateStatus('${id}','Received')">✅ Mark as Received</button>
        </div>
      </div>`,
    'Received': '<span style="font-size:13px;color:#6b21a8">✅ Order has been received</span>'
  };

  const historyHtml = (r.history && r.history.length) ? `
    <div style="margin-top:16px;border-top:1px solid #f0ede8;padding-top:14px">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:#1a1a1a">Change History</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${[...r.history].reverse().map(h => `
          <div style="display:flex;gap:10px;align-items:flex-start;font-size:12px">
            <div style="width:7px;height:7px;border-radius:50%;background:#d4d0c8;margin-top:4px;flex-shrink:0"></div>
            <div>
              <span style="color:#888">${h.date}</span>
              <span style="color:#1a1a1a;margin:0 6px">—</span>
              <span style="font-weight:500">${h.user}</span>
              <span style="color:#888"> changed status to </span>
              <span class="badge badge-${statusClass(h.status)}" style="font-size:11px;padding:1px 7px">${h.status}</span>
              ${h.note ? `<div style="color:#666;margin-top:2px">${h.note}</div>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>` : '';

  document.getElementById('modal-content').innerHTML = `
    <div class="info-grid">
      <div class="info-item"><div class="lbl">Requester</div><div class="val">${r.requester}</div></div>
      <div class="info-item"><div class="lbl">Submitted</div><div class="val">${r.created}</div></div>
      ${r.delivery_date ? `<div class="info-item"><div class="lbl">Expected Delivery</div><div class="val">📦 ${r.delivery_date}</div></div>` : ''}
      <div class="info-item" style="grid-column:1/-1"><div class="lbl">Request Details</div><div class="val" style="font-weight:400;font-size:13px;line-height:1.6">${r.justification || '—'}</div></div>
      ${r.quote_url ? `<div class="info-item" style="grid-column:1/-1"><div class="lbl">Price Quote</div><div class="val"><a href="${r.quote_url}" target="_blank" style="color:#1d4ed8;display:inline-flex;align-items:center;gap:6px;font-size:13px">📄 Open PDF ↗</a></div></div>` : ''}
    </div>
    <div style="overflow-x:auto">
    <table class="items-table" style="margin-bottom:14px">
      <thead><tr><th>Item Name</th><th>PN</th><th>Mfr PN</th><th>Qty</th><th>Price</th><th>Info</th><th>Link</th><th>Vendor</th></tr></thead>
      <tbody>
        ${(r.items || []).map(i => `<tr>
          <td>${i.name}</td><td>${i.pn||'—'}</td><td>${i.mfrPn||'—'}</td><td>${i.qty}</td>
          <td>${i.price?(i.currency||'')+i.price:'—'}</td>
          <td style="max-width:160px;white-space:normal">${i.tech||'—'}</td>
          <td>${i.link?`<a href="${i.link}" target="_blank" style="color:#1d4ed8;font-size:12px">Open ↗</a>`:'—'}</td>
          <td>${i.vendor||'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>
    <div class="action-btns">${actionMap[r.status] || ''}</div>
    ${historyHtml}`;
  document.getElementById('detail-modal').classList.add('open');
}

async function saveDeliveryDate(id) {
  const deliveryDate = document.getElementById('delivery-date-input')?.value || '';
  if (!deliveryDate) { showToast('Please select a date'); return; }
  const { error } = await db.from('requests').update({ delivery_date: deliveryDate }).eq('id', id);
  if (error) { showToast('Error saving date'); console.error(error); return; }
  showToast('Delivery date saved');
  closeModal();
  await loadRequests();
}

async function updateStatus(id, status, note = '') {
  const r = allRequests.find(x => x.id === id);
  if (!r) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const historyEntry = { date: dateStr, user: 'User', status, note };
  const newHistory = [...(r.history || []), historyEntry];
  const { error } = await db.from('requests').update({ status, history: newHistory }).eq('id', id);
  if (error) { showToast('Error updating status'); console.error(error); return; }
  showToast('Status updated: ' + status);
  closeModal();
  await loadRequests();
}

async function updateStatusWithDelivery(id, status) {
  const deliveryDate = document.getElementById('delivery-date-input')?.value || '';
  const r = allRequests.find(x => x.id === id);
  if (!r) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const note = deliveryDate ? `Expected delivery: ${deliveryDate}` : '';
  const historyEntry = { date: dateStr, user: 'User', status, note };
  const newHistory = [...(r.history || []), historyEntry];
  const { error } = await db.from('requests').update({ status, history: newHistory, delivery_date: deliveryDate || null }).eq('id', id);
  if (error) { showToast('Error updating'); console.error(error); return; }
  showToast('Status updated: ' + status);
  closeModal();
  await loadRequests();
}

function closeModal() { document.getElementById('detail-modal').classList.remove('open'); }
function handleOverlayClick(e) { if (e.target === document.getElementById('detail-modal')) closeModal(); }

function switchTab(t, btn) {
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-' + t).classList.add('active');
  if (t === 'requests') renderRequests();
}

let selectedPdfFile = null;

function handleFileSelect(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.type !== 'application/pdf') { showToast('Please select a PDF file only'); input.value = ''; return; }
  if (file.size > 10 * 1024 * 1024) { showToast('File exceeds 10MB limit'); input.value = ''; return; }
  selectedPdfFile = file;
  document.getElementById('upload-zone').classList.add('has-file');
  document.getElementById('upload-label').style.display = 'none';
  const chosen = document.getElementById('upload-chosen');
  chosen.style.display = 'block';
  chosen.innerHTML = `📄 ${file.name} <span style="color:#888;font-weight:400">(${(file.size/1024).toFixed(0)} KB)</span> <button class="btn btn-sm btn-danger" style="margin-left:8px" onclick="clearPdf(event)">Remove</button>`;
}

function handleDragOver(e) { e.preventDefault(); document.getElementById('upload-zone').classList.add('dragover'); }
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) { const input = document.getElementById('f-pdf'); const dt = new DataTransfer(); dt.items.add(file); input.files = dt.files; handleFileSelect(input); }
}

function clearPdf(e) {
  e.stopPropagation();
  selectedPdfFile = null;
  document.getElementById('f-pdf').value = '';
  document.getElementById('upload-zone').classList.remove('has-file');
  document.getElementById('upload-label').style.display = 'flex';
  document.getElementById('upload-chosen').style.display = 'none';
}

async function uploadPdf(requestId) {
  if (!selectedPdfFile) return null;
  const fileName = `${requestId}_${Date.now()}.pdf`;
  const { error } = await db.storage.from('quotes').upload(fileName, selectedPdfFile, { contentType: 'application/pdf' });
  if (error) { console.error('PDF upload error:', error); return null; }
  const { data: urlData } = db.storage.from('quotes').getPublicUrl(fileName);
  return urlData.publicUrl;
}

function addRow() {
  const container = document.getElementById('items-body');
  const div = document.createElement('div');
  div.className = 'item-row';
  div.style.cssText = 'background:#f9f8f5;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #e8e6e0';
  div.innerHTML = `
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 80px;gap:12px;margin-bottom:12px">
      <div class="form-group"><label style="font-size:12px">Item Name</label><input type="text" placeholder="Item name" class="item-name"></div>
      <div class="form-group"><label style="font-size:12px">PN</label><input type="text" placeholder="Optional" class="item-pn"></div>
      <div class="form-group"><label style="font-size:12px">Manufacturer PN</label><input type="text" placeholder="Mfr PN" class="item-mfr-pn"></div>
      <div class="form-group"><label style="font-size:12px">Qty</label><input type="number" min="1" value="1" class="item-qty"></div>
    </div>
    <div style="display:grid;grid-template-columns:120px 100px 1fr 1fr 1fr 36px;gap:12px;align-items:end">
      <div class="form-group"><label style="font-size:12px">Price</label><input type="number" min="0" step="0.01" placeholder="0.00" class="item-price"></div>
      <div class="form-group"><label style="font-size:12px">Currency</label><select class="item-currency" style="border:1px solid #d4d0c8;border-radius:9px;padding:11px 10px;font-size:15px;background:#fff;font-family:'Inter',sans-serif;width:100%"><option>$</option><option>€</option><option>£</option><option>₪</option><option>¥</option></select></div>
      <div class="form-group"><label style="font-size:12px">Info</label><input type="text" placeholder="Info..." class="item-tech"></div>
      <div class="form-group"><label style="font-size:12px">Link</label><input type="text" placeholder="https://..." class="item-link"></div>
      <div class="form-group"><label style="font-size:12px">Vendor</label><input type="text" placeholder="Optional" class="item-vendor"></div>
      <button class="btn btn-sm btn-danger" onclick="removeRow(this)" style="margin-bottom:2px">✕</button>
    </div>`;
  container.appendChild(div);
}

function removeRow(btn) {
  const rows = document.querySelectorAll('#items-body .item-row');
  if (rows.length > 1) btn.closest('.item-row').remove();
}

function clearForm() {
  ['f-requester','f-justification'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('items-body').innerHTML = `<div class="item-row" style="background:#f9f8f5;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #e8e6e0"><div style="display:grid;grid-template-columns:2fr 1fr 1fr 80px;gap:12px;margin-bottom:12px"><div class="form-group"><label style="font-size:12px">Item Name</label><input type="text" placeholder="Item name" class="item-name"></div><div class="form-group"><label style="font-size:12px">PN</label><input type="text" placeholder="Optional" class="item-pn"></div><div class="form-group"><label style="font-size:12px">Manufacturer PN</label><input type="text" placeholder="Mfr PN" class="item-mfr-pn"></div><div class="form-group"><label style="font-size:12px">Qty</label><input type="number" min="1" value="1" class="item-qty"></div></div><div style="display:grid;grid-template-columns:120px 100px 1fr 1fr 1fr 36px;gap:12px;align-items:end"><div class="form-group"><label style="font-size:12px">Price</label><input type="number" min="0" step="0.01" placeholder="0.00" class="item-price"></div><div class="form-group"><label style="font-size:12px">Currency</label><select class="item-currency" style="border:1px solid #d4d0c8;border-radius:9px;padding:11px 10px;font-size:15px;background:#fff;font-family:'Inter',sans-serif;width:100%"><option>$</option><option>€</option><option>£</option><option>₪</option><option>¥</option></select></div><div class="form-group"><label style="font-size:12px">Info</label><input type="text" placeholder="Info..." class="item-tech"></div><div class="form-group"><label style="font-size:12px">Link</label><input type="text" placeholder="https://..." class="item-link"></div><div class="form-group"><label style="font-size:12px">Vendor</label><input type="text" placeholder="Optional" class="item-vendor"></div><button class="btn btn-sm btn-danger" onclick="removeRow(this)" style="margin-bottom:2px">✕</button></div></div>`;
  selectedPdfFile = null;
  document.getElementById('f-pdf').value = '';
  document.getElementById('upload-zone').classList.remove('has-file');
  document.getElementById('upload-label').style.display = 'flex';
  document.getElementById('upload-chosen').style.display = 'none';
}

async function submitRequest() {
  const requester = document.getElementById('f-requester').value.trim();
  if (!requester) { showToast('Please enter requester name'); return; }
  const items = [];
  let valid = true;
  document.querySelectorAll('#items-body .item-row').forEach(row => {
    const name = row.querySelector('.item-name').value.trim();
    const qty  = parseFloat(row.querySelector('.item-qty').value) || 0;
    if (!name || qty <= 0) { valid = false; return; }
    items.push({
      name, qty,
      pn:       row.querySelector('.item-pn').value.trim(),
      mfrPn:    row.querySelector('.item-mfr-pn').value.trim(),
      price:    row.querySelector('.item-price').value.trim(),
      currency: row.querySelector('.item-currency').value,
      tech:     row.querySelector('.item-tech').value.trim(),
      link:     row.querySelector('.item-link').value.trim(),
      vendor:   row.querySelector('.item-vendor').value.trim()
    });
  });
  if (!valid || !items.length) { showToast('Please fill in item name and quantity for each row'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = selectedPdfFile ? 'Uploading...' : 'Submitting...';

  const id = 'RQ-' + String(nextIdNum).padStart(3, '0');
  const quoteUrl = await uploadPdf(id);
  if (selectedPdfFile && !quoteUrl) {
    showToast('Error uploading file — please try again');
    btn.disabled = false; btn.textContent = 'Submit Request →'; return;
  }

  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const record = {
    id, requester,
    dept: '', vendor: '',
    date: now.toISOString().slice(0,10),
    justification: document.getElementById('f-justification').value.trim(),
    status: 'Pending',
    items,
    quote_url: quoteUrl || null,
    delivery_date: null,
    history: [{ date: dateStr, user: requester, status: 'Pending', note: 'Request submitted' }],
    created: now.toISOString().slice(0,10)
  };

  const { error } = await db.from('requests').insert([record]);
  btn.disabled = false;
  btn.textContent = 'Submit Request →';
  if (error) { showToast('Save error: ' + error.message); console.error(error); return; }
  nextIdNum++;
  showToast('Request ' + id + ' submitted successfully!');
  clearForm();
  await loadRequests();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

loadRequests();
</script>
